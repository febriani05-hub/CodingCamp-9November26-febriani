<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="app-wrapper">

    <!-- ── Header / Balance ───────────────────────────────────── -->
    <header class="app-header">
      <h1 class="app-title">💰 Budget Visualizer</h1>
      <div class="balance-card">
        <span class="balance-label">Total Balance</span>
        <span class="balance-amount" id="totalBalance">$0.00</span>
      </div>
    </header>

    <!-- ── Main layout ────────────────────────────────────────── -->
    <main class="app-main">

      <!-- Left column: form + list -->
      <section class="left-col">

        <!-- Add Transaction Form -->
        <div class="card">
          <h2 class="card-title">Add Transaction</h2>
          <form id="transactionForm" novalidate>

            <div class="form-group">
              <label for="itemName">Item Name</label>
              <input
                type="text"
                id="itemName"
                placeholder="e.g. Lunch, Bus ticket…"
                autocomplete="off"
              />
              <span class="field-error" id="nameError"></span>
            </div>

            <div class="form-group">
              <label for="amount">Amount ($)</label>
              <input
                type="number"
                id="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
              />
              <span class="field-error" id="amountError"></span>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category">
                <option value="">— Select category —</option>
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚌 Transport</option>
                <option value="Fun">🎉 Fun</option>
              </select>
              <span class="field-error" id="categoryError"></span>
            </div>

            <button type="submit" class="btn-add">+ Add Transaction</button>
          </form>
        </div>

        <!-- Transaction List -->
        <div class="card">
          <h2 class="card-title">Transactions
            <span class="tx-count" id="txCount">0</span>
          </h2>

          <div class="tx-list-wrapper">
            <ul class="tx-list" id="txList">
              <!-- populated by JS -->
            </ul>
            <p class="empty-state" id="emptyState">No transactions yet. Add one above!</p>
          </div>
        </div>

      </section>

      <!-- Right column: chart -->
      <section class="right-col">
        <div class="card chart-card">
          <h2 class="card-title">Spending by Category</h2>
          <div class="chart-container">
            <canvas id="spendingChart"></canvas>
          </div>
          <p class="chart-empty" id="chartEmpty">Add transactions to see the chart.</p>
        </div>
      </section>

    </main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
